<style>

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f6f2;--card:#fff;--c2:#ebf3ee;--tx:#0d1117;--mu:#5c6b62;--ac:#22c55e;--ac2:#4ade80;--bd:#dbe7df;--g1:#fff;--g2:#f3f8f4;color-scheme:light}}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
body{margin:0 auto;background:radial-gradient(1000px 420px at 50% -140px,#22c55e26,transparent),var(--bg);background-attachment:fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1000px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(95px + env(safe-area-inset-bottom,0px));overflow-x:hidden;word-wrap:break-word}
h1{font-size:21px;margin:0;background:linear-gradient(90deg,var(--tx),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;white-space:nowrap}
h2{font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}h2:before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--ac),var(--ac2));flex:none}h3{margin:0 0 4px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:8px 11px;max-width:100%}
button{cursor:pointer;transition:opacity .15s,background .15s}
button:active{opacity:.8}

button.danger{background:#e74c3c22;color:#ff6b6b;border-color:#e74c3c55}

.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}.star{color:#f5a623}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));z-index:15}
#nav button{flex:1;max-width:130px;border:0;background:none;font-size:10px;padding:5px 0;border-radius:12px;color:var(--mu)}#nav button span{display:block;font-size:19px;margin-bottom:2px}#nav button.on{background:none;color:var(--ac);font-weight:700}

/* Grilles & Cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}

.cov{height:195px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:32px;position:relative;overflow:hidden;background-size:cover!important;background-position:center!important;flex:none}

/* Modales & Formulaires */

.prev-img img{width:100%;height:100%;object-fit:cover}

/* Saisons box */

.season-row .fl{grid-column:1/-1;font-size:12px;padding:6px 9px}

/* Wrap & Story */
.wrap{background:linear-gradient(135deg,#1b221d,#0f2a1a 60%,#22c55e88);border:1px solid var(--bd);color:#fff;border-radius:20px;padding:18px;margin:10px 0;overflow:hidden}

.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}.ev:last-child{border:0}
.ev .t{width:36px;height:50px;border-radius:8px;background-color:var(--c2);background-size:cover;background-position:center;flex:none;overflow:hidden;position:relative}
.ev .t img{width:100%;height:100%;object-fit:cover;display:block}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:10px 16px;border-radius:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90%;text-align:center;font-size:13px;font-weight:600}#toast.show{opacity:1;transform:translate(-50%,0)}

/* Fullscreen Wrapped */
#wr{position:fixed;inset:0;background:#000;z-index:50;display:none;align-items:center;justify-content:center}#wr.on{display:flex}
.ws{position:relative;width:100%;max-width:430px;height:100%;max-height:840px;overflow:hidden;color:#fff;display:flex;flex-direction:column;background:#000}
@media(min-width:500px){.ws{border-radius:26px;height:94vh}}
.sl{position:absolute;inset:0;padding:86px 24px 96px;overflow-y:auto;color:#fff;display:flex;flex-direction:column;scrollbar-width:none}.sl::-webkit-scrollbar{display:none}
.wp{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;gap:6px;z-index:3}.wp i{flex:1;height:4px;border-radius:4px;background:#ffffff40}.wp i.d{background:#fff}
.wx{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:12px;z-index:4;background:none;border:0;color:#fff;border-radius:50%;width:36px;height:36px;font-size:22px;padding:0}
.pp{animation:wi .6s ease both}@keyframes wi{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.wn{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:16px;right:16px;display:flex;gap:10px;z-index:5}
.wn button{flex:1;padding:14px;border-radius:14px;border:0;font-weight:700;background:#ffffff26;backdrop-filter:blur(8px);color:#fff;font-size:15px}.wn button.nx{background:#fff;color:#14532d;flex:2}
.kk2{font-weight:800;font-size:13px;letter-spacing:2.5px;text-transform:uppercase}
.cd{font-family:Anton,Impact,"Arial Narrow Bold","Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;line-height:.96;word-break:break-word}
.rk{display:flex;align-items:center;gap:12px;margin-bottom:14px}.sbx{border-radius:24px;padding:16px}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid #ffffff47;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.bar2{height:12px;background:#ffffff22;border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;background:#22c55e;border-radius:9px}

/* Calendrier */
.cw{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw .hd{text-align:center;font-size:11px;color:var(--mu);padding-bottom:2px}
.dy{aspect-ratio:3/4;position:relative;border-radius:9px;overflow:hidden;background:var(--c2);color:var(--mu);font-size:11px;padding:4px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.dy img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.dy.e{cursor:default}.dy.w{color:#fff}.dy.w:before{content:"";position:absolute;inset:0;background:linear-gradient(#0008,transparent 45%,#000e);z-index:1}.dy>*:not(img){position:relative;z-index:2}
.dy b{font-size:11px}.dy.w b{text-shadow:0 1px 3px #0009}.dy span{align-self:flex-end;font-weight:800;font-size:12px;text-shadow:0 1px 3px #000}
.dy i{font-style:normal;position:absolute;top:3px;right:3px;background:#000c;border-radius:99px;padding:0 4px;font-size:9px;color:#fff;z-index:2}
.dy.sel{outline:2px solid var(--ac2);outline-offset:1px}.dy.td b{color:var(--ac2)}.dy.w.td b{text-decoration:underline}
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.ym{cursor:pointer;margin:0}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}.mg i{aspect-ratio:1;border-radius:3px;background:var(--c2);display:block}.mg i.on{background:var(--ac)}
:root[data-theme="light"]{--bg:#f1f6f2;--card:#fff;--c2:#ebf3ee;--tx:#0d1117;--mu:#5c6b62;--bd:#dbe7df;--g1:#fff;--g2:#f3f8f4;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
</style></head><body>

<div class="row" style="gap:8px;margin-bottom:6px">
  <span id="lgo" style="display:flex;flex:none"></span>
  <h1>game<span style="color:var(--ac)">+</span></h1>
  <div class="row" style="margin-left:auto;gap:6px">
    <button class="pri" onclick="openAnimeModal()" style="padding:6px 11px;font-size:13px">+ Jeu</button>
    <button id="und" onclick="undo()" aria-label="Annuler la dernière action" style="padding:6px 11px;font-size:13px">↩</button>
    <button onclick="openLogModal()" style="padding:6px 11px;font-size:13px">+ Session</button>
    <button id="thm" onclick="toggleTheme()" aria-label="Changer de thème" style="padding:6px 9px;font-size:15px"></button>
  </div>
</div>

<main id="v"></main>
<div id="modal"></div>
<div id="toast"></div>
<div id="wr"></div>
<nav id="nav"></nav>

<script>
var KD="M22 34H78C88 34 94 42 95 54L97 70C98 78 93 84 86 84C80 84 77 80 74 76L70 70H30L26 76C23 80 20 84 14 84C7 84 2 78 3 70L5 54C6 42 12 34 22 34ZM28 46a6 6 0 1 0 0 12a6 6 0 1 0 0-12ZM70 44a4.5 4.5 0 1 0 0 9a4.5 4.5 0 1 0 0-9ZM80 54a4.5 4.5 0 1 0 0 9a4.5 4.5 0 1 0 0-9Z";
function KL(z){return '<svg width="'+z+'" height="'+z+'" viewBox="0 0 100 100" aria-label="game+"><defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset=".5" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="#07140c"/><path d="'+KD+'" fill="url(#kg)"/></svg>'}

function curTheme(){return document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("kt-theme",t)}catch(e){}document.getElementById("thm").textContent=t==="dark"?"☀️":"🌙"}
function toggleTheme(){setTheme(curTheme()==="dark"?"light":"dark")}
(function(){var t=null;try{t=localStorage.getItem("kt-theme")}catch(e){}if(t)document.documentElement.setAttribute("data-theme",t);document.getElementById("thm").textContent=curTheme()==="dark"?"☀️":"🌙";document.getElementById("lgo").innerHTML=KL(28)})();

var ST={watching:"En cours",plan:"Envie de jouer",owned:"Possédé",pause:"En pause",drop:"Abandonné",done:"Terminé"};
var ORD=["watching","plan","owned","pause","drop","done"];
var TY=["PC","PS5","PS4","PS3","Switch","Switch 2","3DS","Wii","Xbox","Mobile","Autre"];
var DJ=["lun","mar","mer","jeu","ven","sam","dim"];
var S={items:[],log:[],goal:30,prof:{name:"Joueur",av:"🎮"},bdg:{},notif:{},lists:[]};

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function ld(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return ld()}
function hue(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;return h}
function ini(t){return esc((t||"?").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase())}
function dur(it){return 60}
function fmtH(n){var m=Math.round((Number(n)||0)*60),h=Math.floor(m/60),r=m%60;if(!h)return r+" min";return h+" h"+(r?" "+(r<10?"0":"")+r:"")}
// Écrit une durée pour un champ de saisie : 3.5 -> "3h30", 0.5333 -> "32min"
function fmtIn(n){var m=Math.round((Number(n)||0)*60),h=Math.floor(m/60),r=m%60;if(!m)return "";if(!h)return r+"min";return h+"h"+(r?(r<10?"0":"")+r:"")}
// Lit une durée libre -> heures décimales. Accepte : 3h30, 3h 30, 1h, 32min, 32 min, 90m, 2:30, 1,5, 1.5, 3h30min
function parseDur(v){
  v=String(v==null?"":v).toLowerCase().replace(/\s+/g,"").replace(/,/g,".");
  if(!v)return 0;
  var m;
  if((m=v.match(/^(\d+):(\d{1,2})$/)))return +m[1]+(+m[2])/60;
  if((m=v.match(/^(?:(\d+(?:\.\d+)?)(?:h|heures?|hr?))?(?:(\d+(?:\.\d+)?)(?:min|mn|m)?)?$/))&&(m[1]||m[2])){
    var h=m[1]?parseFloat(m[1]):0,mi=m[2]?parseFloat(m[2]):0;
    if(!m[1]&&m[2]&&!/(min|mn|m)$/.test(v))return mi;
    return h+mi/60;
  }
  if((m=v.match(/^(\d+(?:\.\d+)?)(?:min|mn|m)$/)))return parseFloat(m[1])/60;
  var f=parseFloat(v);return isNaN(f)?0:f;
}
function setDur(id,h){var e=$(id);if(e)e.value=fmtIn(h)}
function fmt(n){return Math.round((Number(n)||0)*100)/100}
function toast(m){var t=$("toast");t.textContent=m;t.className="show";setTimeout(()=>{t.className=""},3000)}
function byId(id){return S.items.find(i=>String(i.id)===String(id))}
function dlBlob(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function canonEp(s){return Number(s.ep)||0}
function advance(s,n){var p=Math.round(((Number(s.ep)||0)+n)*10000)/10000;return{pos:p,n:n}}
// Calcul global des épisodes et de la saison active
function getAnimeStats(it){
  if(it.seasons && it.seasons.length > 0){
    var totalEp = 0, watchedEp = 0;
    var activeSeason = it.seasons[0];
    for(var s of it.seasons){
      totalEp += Number(s.total)||0;
      watchedEp += canonEp(s);
      if((Number(s.ep)||0) < (Number(s.total)||1e9) && !activeSeason){
        activeSeason = s;
      }
    }
    // Trouver la saison en cours (la première non terminée)
    var curr = it.seasons.find(s => (Number(s.ep)||0) < (Number(s.total)||1e9)) || it.seasons[it.seasons.length-1];
    return {
      ep: curr ? Number(curr.ep)||0 : watchedEp,
      total: curr ? Number(curr.total)||0 : totalEp,
      seasonLabel: curr ? (curr.name || `Partie ${curr.num}`) : "",
      totalWatched: watchedEp
    };
  }
  return { ep: Number(it.ep)||0, total: Number(it.total)||0, seasonLabel: it.seasonLabel||"", totalWatched: Number(it.ep)||0 };
}

function epDisp(it){
  var st = getAnimeStats(it);
  return (st.seasonLabel ? st.seasonLabel + " · " : "") + fmtH(st.ep);
}

function cnt(arr){var o={};arr.forEach(x=>{o[x]=(o[x]||0)+1});return Object.keys(o).map(k=>[k,o[k]]).sort((a,b)=>b[1]-a[1])}
function flat(its){var g=[];(its||S.items).forEach(i=>(i.genres||"").split(",").forEach(x=>{x=x.trim();if(x)g.push(x)}));return g}
function bars(a,u){var m=a.length?a[0][1]:1;return a.map(x=>'<div class="h"><span title="'+esc(x[0])+'">'+esc(x[0])+'</span><div class="bw"><i style="width:'+Math.max(4,x[1]/m*100)+'%"></i></div><span class="mu">'+x[1]+(u||"")+'</span></div>').join("")}
function avg(l){var r=l.filter(i=>i.rating);return r.length?(r.reduce((s,i)=>s+Number(i.rating),0)/r.length).toFixed(1):"–"}

// Compression d'image
function compressImageFile(file, maxW, maxH, quality){
  return new Promise((resolve, reject)=>{
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var ratio = Math.min(maxW / w, maxH / h, 1);
        var cw = Math.round(w * ratio), ch = Math.round(h * ratio);
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImg(u){
  return new Promise(r=>{
    if(!u) return r(null);
    var done=false, fin=v=>{if(!done){done=true;r(v)}};
    var i=new Image();
    if(!u.startsWith("data:")) i.crossOrigin="anonymous";
    i.onload=()=>fin(i);
    i.onerror=()=>{
      if(!u.startsWith("data:")){
        var i2=new Image();
        i2.onload=()=>fin(i2);
        i2.onerror=()=>fin(null);
        i2.src=u;
      } else fin(null);
    };
    i.src=u;
    setTimeout(()=>fin(null),8000);
  });
}

// Incrémente l'épisode dans la saison active en cours
function quickEp(id, delta){
  var it = byId(id);
  if(!it || !it.seasons || !it.seasons.length) return;
  // Trouver la saison active (première non finie)
  var activeSeason = it.seasons.find(s => (Number(s.ep)||0) < (Number(s.total)||1e9)) || it.seasons[it.seasons.length-1];
  var adv = advance(activeSeason, delta), newEp = adv.pos, diff = adv.n, moved = newEp !== (Number(activeSeason.ep)||0);
  if(diff === 0 && !moved){ toast("Saison déjà au maximum ("+activeSeason.total+" ép.)"); return; }
  
  activeSeason.ep = newEp;
  if(!it.started && newEp > 0) it.started = today();
  
  // Vérifier si toutes les saisons sont finies
  var allDone = false;
  if(allDone){ it.status = "done"; it.fin = today(); }
  else if(it.status === "plan" && newEp > 0){ it.status = "watching"; }
  
  S.log.push({ id: it.id, d: today(), n: diff, e: newEp, t: Date.now() });
  save();
  render();
  var st = getAnimeStats(it);
  toast(`+1 h · ${it.title} (${fmtH(newEp)} au total)`);
}

function saveAnimeForm(e, id){
  e.preventDefault();
  var title = $("f_title").value.trim();
  if(!title) return;
  var status = $("f_status").value;
  var pd = ($("f_date")&&$("f_date").value)||today();

  tempSeasons = [{ num: 1, name: "Jeu principal", ep: Math.max(0, parseDur($("f_h").value)), total: Math.max(0, parseDur($("f_t").value)) }];
  var totalWatched = tempSeasons.reduce((s, x) => s + canonEp(x), 0);
  var allDone = false;
  if(allDone && status === "watching") status = "done";

  var data = {
    title: title,
    seasons: tempSeasons,
    status: status,
    type: $("f_type").value,
    dur: Math.max(1, parseInt($("f_dur").value, 10) || 24),
    rating: parseFloat($("f_rat").value) || 0,
    genres: $("f_gen").value.trim(),
    studio: $("f_stu").value.trim(),
    review: $("f_rev") ? $("f_rev").value.trim() : "",
    fav: $("f_fav").checked,
    old: $("f_old").checked,
    cover: tempCover
  };

  if(id){
    var it = byId(id);
    if(it){
      var oldStats = getAnimeStats(it);
      Object.assign(it, data);
      if(status === "done" && !it.fin) it.fin = today();
      var newStats = getAnimeStats(it);
      if(newStats.totalWatched > oldStats.totalWatched){
        var diff = newStats.totalWatched - oldStats.totalWatched;
        S.log.push({ id: it.id, d: pd, n: diff, e: newStats.ep, t: Date.now() });
      }
    }
    toast("Jeu mis à jour !");
  } else {
    var newId = uid();
    var item = Object.assign({
      id: newId,
      added: today(),
      started: totalWatched > 0 ? pd : "",
      fin: status === "done" ? today() : ""
    }, data);
    S.items.unshift(item);
    var autoLog = $("f_autolog") && $("f_autolog").checked;
    if(autoLog && totalWatched > 0){
      S.log.push({ id: newId, d: pd, n: totalWatched, e: getAnimeStats(item).ep, t: Date.now() });
    }
    toast("Jeu ajouté !");
  }
  save();
  closeModal();
  render();
}

function deleteAnime(id){
  if(!confirm("Supprimer ce jeu et son historique ?")) return;
  S.items = S.items.filter(i => String(i.id) !== String(id));
  S.log = S.log.filter(l => String(l.id) !== String(id));
  save();
  closeModal();
  render();
  toast("Jeu supprimé");
}

function saveLogForm(e){
  e.preventDefault();
  var id = $("l_anime").value;
  var rawN = String($("l_n").value).trim(), n = parseDur(rawN);
  if(/^\d+$/.test(rawN) && +rawN >= 10) n = (+rawN)/60; // "45" seul = 45 minutes
  if(!(n>0)){ toast("Entre un temps valide (ex: 32 min, 3h30)"); return; }
  var d = $("l_date").value || today();
  var it = byId(id);
  if(!it || !it.seasons || !it.seasons.length) return;

  // Ajouter les épisodes sur la saison active en cours
  var activeSeason = it.seasons.find(s => (Number(s.ep)||0) < (Number(s.total)||1e9)) || it.seasons[it.seasons.length-1];
  var adv = advance(activeSeason, n), newEp = adv.pos, realAdded = adv.n;
  if(!realAdded && newEp === (Number(activeSeason.ep)||0)){ toast("Saison déjà au maximum"); return; }

  activeSeason.ep = newEp;
  if(!it.started) it.started = d;
  
  var allDone = false;
  if(allDone){ it.status = "done"; it.fin = d; }
  else if(it.status === "plan"){ it.status = "watching"; }

  S.log.push({ id: it.id, d: d, n: realAdded, e: newEp, t: Date.now() });
  sd = d;
  am = month = d.slice(0,7);
  cy = year = +d.slice(0,4);
  save();
  closeModal();
  render();
  toast(`+${fmtH(realAdded)} ajouté pour ${it.title} !`);
}

var LPF={pc:"PC",switch:"Switch","switch-2":"Switch 2",switch2:"Switch 2","3ds":"3DS",wii:"Wii",ps5:"PS5",ps4:"PS4",ps3:"PS3",xbox:"Xbox","xbox-one":"Xbox","xbox-series":"Xbox",mobile:"Mobile",android:"Mobile",ios:"Mobile"};
var LST={backlog:"plan",wishlist:"plan",owned:"owned",playing:"watching",played:"done",completed:"done",paused:"pause",abandoned:"drop",dropped:"drop"};
function isLoadia(o){return o&&!Array.isArray(o)&&Array.isArray(o.library)&&(o.app==="Loadia"||Array.isArray(o.diary))}
function slugTitle(id){
  var POS={luigis:"Luigi's",marvels:"Marvel's",bowsers:"Bowser's",diddys:"Diddy's",kirbys:"Kirby's",lets:"Let's",majoras:"Majora's",yoshis:"Yoshi's",assassins:"Assassin's",drakes:"Drake's"};
  var UP={hd:1,dx:1,ost:1,vr:1,ii:1,iii:1,iv:1,vi:1,vii:1,viii:1,ix:1,xi:1,xii:1,xiii:1,xiv:1,xv:1,xvi:1};
  var LOW={of:1,the:1,and:1,in:1,to:1,a:1,an:1,for:1,on:1,at:1,vs:1};
  id=String(id||"");
  if(/^nier-replicant/.test(id))return"NieR Replicant ver.1.22474487139";
  var w=id.split("-");
  if(w.length>1&&/^\d{5,}$/.test(w[w.length-1]))w.pop();
  var out=[];
  for(var i=0;i<w.length;i++){var x=w[i],nx=w[i+1];
    if(x==="pok"&&nx==="mon"){out.push("Pokémon");i++;continue}
    if(x==="steins"&&nx==="gate"){out.push("Steins;Gate");i++;continue}
    if(x==="links"&&nx==="awakening"){out.push("Link's");continue}
    if(x==="demons"&&nx==="souls"){out.push("Demon's");continue}
    if(POS[x]&&x!=="lets"||x==="lets"){out.push(POS[x]);continue}
    if(UP[x]){out.push(x.toUpperCase());continue}
    if(i>0&&LOW[x]){out.push(x);continue}
    out.push(x.charAt(0).toUpperCase()+x.slice(1));
  }
  return out.join(" ")}
function importLoadia(o){
  var fav={};(o.favorites||[]).forEach(function(g){fav[g]=1});
  var hype={};(o.hype||[]).forEach(function(h){if(h&&h.gameId)hype[h.gameId]=h.value});
  var cur={};((o.localSnapshot&&o.localSnapshot.currentlyPlaying)||[]).forEach(function(g){cur[g]=1});
  var dia={};(o.diary||[]).forEach(function(e){var p=dia[e.gameId];if(!p||String(e.date)>String(p.date))dia[e.gameId]=e;});
  var have={};S.items.forEach(function(i){have[String(i.id)]=1});
  var add=0,dup=0,withTime=0,mins=0,gids={};
  var lib=o.library.slice().sort(function(a,b){return String(b.updatedAt||"").localeCompare(String(a.updatedAt||""))});
  lib.forEach(function(g){
    if(!g||!g.gameId)return;
    gids[g.gameId]=1;
    if(have[g.gameId]){dup++;return}
    var st=LST[String(g.status||"").toLowerCase()]||"plan";
    if(g.completed)st="done";
    var d=dia[g.gameId]||{};
    var pf=(g.platforms||d.platforms||[]).map(function(p){return LPF[String(p).toLowerCase()]||String(p)});
    var m=Number(g.playtimeMinutes)||0;if(m){withTime++;mins+=m}
    var added=String(g.addedAt||"").slice(0,10)||today();
    var it={
      id:g.gameId,loadiaId:g.gameId,title:slugTitle(g.gameId),status:st,
      type:pf[0]||"PC",platforms:pf,rating:Number(g.rating)||0,fav:!!(g.liked||fav[g.gameId]),
      genres:"",studio:"",dur:60,review:g.review?String(g.review):"",spoiler:!!g.spoiler,
      replays:Number(g.replayCount)||0,completed:!!g.completed,hype:hype[g.gameId]||0,
      nowPlaying:!!cur[g.gameId],added:added,
      started:String(d.startedAt||"").slice(0,10)||(m?added:""),
      fin:st==="done"?(String(d.finishedAt||"").slice(0,10)||String(d.date||g.updatedAt||"").slice(0,10)):"",
      seasons:[{num:1,name:"Jeu principal",ep:Math.round(m/60*10000)/10000,total:0}]
    };
    S.items.push(it);have[g.gameId]=1;add++;
  });
  var nl=0;
  (o.lists||[]).forEach(function(l){
    if(!l||!l.id||S.lists.some(function(x){return x.id===l.id}))return;
    S.lists.push({id:l.id,title:l.title||"Liste",ids:(l.gameIds||[]).filter(function(g){return have[g]}),ranked:!!l.ranked});nl++;
  });
  if(o.account&&o.account.displayName&&(!S.prof||!S.prof.name||S.prof.name==="Joueur"))S.prof=Object.assign({},S.prof,{name:o.account.displayName});
  return{add:add,dup:dup,lists:nl,withTime:withTime,hours:Math.round(mins/60)}
}

// Import tolérant : accepte le .json de game+ ET d'autres formats (tableau direct, items/games/jeux/animes, noms de champs variés)
function pick(o,keys){for(var k of keys){if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k]}return undefined}
function toHours(v){if(typeof v==="number")return v;return parseDur(v)}
function stMap(v){v=String(v||"").toLowerCase();
  if(ST[v])return v;
  if(/(termin|fini|done|complet|finish|beaten|100)/.test(v))return"done";
  if(/(abandon|drop|arr[eê]t)/.test(v))return"drop";
  if(/(pause|hold|suspend)/.test(v))return"pause";
  if(/(plan|envie|wish|backlog|todo|[àa] faire|want)/.test(v))return"plan";
  return"watching"}
function convItem(it){
  if(!it||typeof it!=="object")return null;
  var title=pick(it,["title","titre","name","nom","game","jeu"]);if(!title)return null;
  var o=Object.assign({},it);
  o.id=String(pick(it,["id","uid","_id"])||uid());
  o.title=String(title);
  var cv=pick(it,["cover","image","img","poster","thumbnail","icon","pochette"]);if(cv)o.cover=String(cv);
  o.status=stMap(pick(it,["status","statut","state","etat"]));
  var rt=parseFloat(pick(it,["rating","note","score","rate"]));o.rating=isNaN(rt)?0:rt;
  var gn=pick(it,["genres","genre","tags","categories"]);o.genres=Array.isArray(gn)?gn.join(", "):(gn?String(gn):"");
  var stu=pick(it,["studio","developer","developpeur","dev","editeur"]);if(stu)o.studio=String(stu);
  o.fav=!!pick(it,["fav","favorite","favori","favorit","liked"]);
  if(!o.started){var sd_=pick(it,["started","start","debut","startedAt"]);if(sd_)o.started=String(sd_).slice(0,10)}
  if(!o.fin){var fd=pick(it,["fin","finished","end","finishedAt","completedAt"]);if(fd)o.fin=String(fd).slice(0,10)}
  if(!o.added)o.added=today();
  if(Array.isArray(it.seasons)&&it.seasons.length){
    o.seasons=it.seasons.map(function(x,i){return{num:Number(x.num)||i+1,name:x.name||x.nom||x.title||("Partie "+(i+1)),ep:toHours(pick(x,["ep","hours","heures","playtime","time","temps"])||0),total:toHours(pick(x,["total","toFinish","pourFinir","main"])||0)}})
  }else{
    delete o.seasons;
    o.seasons=[{num:1,name:it.seasonLabel||"Jeu principal",ep:toHours(pick(it,["ep","hours","heures","playtime","playTime","time","temps","hoursPlayed","played"])||0),total:toHours(pick(it,["total","toFinish","hoursToFinish","main","mainStory"])||0)}]
  }
  return o}
function convImport(o){
  var arr=Array.isArray(o)?o:pick(o,["items","games","jeux","animes","library","collection","list","data"]);
  if(arr&&!Array.isArray(arr)&&Array.isArray(arr.items))arr=arr.items;
  if(!Array.isArray(arr))throw 0;
  var items=arr.map(convItem).filter(Boolean);if(!items.length)throw 0;
  var ids={};items.forEach(function(i){ids[i.id]=1});
  var log=(!Array.isArray(o)&&Array.isArray(o.log)?o.log:[]).filter(function(l){return l&&l.d&&ids[String(l.id)]}).map(function(l){return Object.assign({},l,{id:String(l.id),n:Number(l.n)||0})});
  var base=Array.isArray(o)?{}:o;
  return Object.assign(blank(),base,{items:items,log:log})}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=()=>{try{var o=JSON.parse(r.result);if(isLoadia(o)){var rs=importLoadia(o);norm();save();tab="animes";filterSt="all";render();toast("Loadia : "+rs.add+" jeux importés"+(rs.dup?" ("+rs.dup+" déjà présents)":"")+" · "+rs.lists+" liste(s) · "+rs.hours+" h")}else{S=convImport(o);norm();save();tab="animes";render();toast("Import réussi · "+S.items.length+" jeux")}}catch(e){toast("Fichier invalide")}el.value=""};r.readAsText(f)}

loadS();LAST=JSON.stringify(S);render();
</script>
